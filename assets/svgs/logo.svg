  <!-- Typography -->
  <text x="72" y="28" font-family="'Cinzel', 'Times New Roman', serif, system-ui" font-weight="700" font-size="20" fill="#F4F4F5" letter-spacing="2">PARAMOUNT</text>
  <text x="236" y="28" font-family="'Cinzel', 'Times New Roman', serif, system-ui" font-weight="700" font-size="20" fill="url(#gold-grad)" letter-spacing="2">LIMOUSINE</text>
  <text x="72" y="47" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="9.5" fill="#A1A1AA" letter-spacing="2.2">LOS ANGELES, CA &bull; EXECUTIVE FLEET &bull; EST. 1989</text>
